{% extends "base.html" %}

{% block content %}
<div class="container pb-4">
  <div class="panel mb-3 d-flex flex-wrap gap-2 justify-content-between align-items-center">
    <div>
      <h1 class="h4 mb-1">View CSV</h1>
      <p class="text-muted mb-0">{{ filename }}</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary" href="{{ url_for('manage_files') }}">Back to Manager</a>
      <a class="btn btn-accent" href="{{ url_for('download_csv', filename=filename) }}">Download</a>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0">
        <thead>
          <tr>
            {% for h in headers %}
            <th>{{ h }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for row in rows %}
          <tr>
            {% for cell in row %}
            <td>{{ cell }}</td>
            {% endfor %}
          </tr>
          {% endfor %}
          {% if not rows %}
          <tr><td colspan="{{ headers|length if headers else 1 }}">No data rows found.</td></tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
