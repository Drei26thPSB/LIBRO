<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSB Library CSV Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-soft: #f8f9fd;
      --line: #dce2f0;
      --text: #1b1f2a;
      --muted: #56607a;
      --primary: #8a1538;
      --primary-press: #6e102d;
      --accent: #a3204b;
      --gold: #f4c542;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 14px 30px rgba(92, 15, 38, 0.12);
    }
    body {
      font-family: "Manrope", sans-serif;
      background: radial-gradient(circle at 10% 0%, rgba(138, 21, 56, 0.14) 0%, transparent 44%),
                  radial-gradient(circle at 90% 8%, rgba(163, 32, 75, 0.10) 0%, transparent 38%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .topbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .brand-link {
      color: var(--text);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      object-fit: cover;
      margin-right: 10px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      vertical-align: middle;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--primary-press);
      border-color: var(--primary-press);
    }
    .btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-accent:hover, .btn-accent:focus {
      background: #87143a;
      border-color: #87143a;
      color: #fff;
    }
    .btn {
      border-radius: 12px;
      font-weight: 600;
    }
    .form-control, .form-select {
      border-radius: var(--radius-sm);
      border-color: var(--line);
      padding-top: 0.6rem;
      padding-bottom: 0.6rem;
    }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table thead th {
      background: var(--surface-soft);
      border-bottom-color: var(--line);
      font-weight: 700;
      font-size: 0.83rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      color: var(--muted);
      background: var(--surface-soft);
    }
  </style>
</head>
<body>
<nav class="topbar py-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="brand-link" href="{{ url_for('manage_files') }}"><img class="brand-logo" src="{{ url_for('static', filename='PSB_Logo.png') }}" alt="PSB Logo">PSB Library CSV Manager</a>
    {% if session.get('authenticated') %}
    <form method="post" action="{{ url_for('logout') }}">
      <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
    </form>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
